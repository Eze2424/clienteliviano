spring.application.name=clienteliviano
server.port=8086
backend.api.url.donaciones:http://localhost:8080/donaciones-service

# confg keyclaok
spring.security.oauth2.client.registration.keycloak.client-id=donatrack-client

# Si le pusiste un Client Secret en Keycloak al cliente, agregalo acá:
# spring.security.oauth2.client.registration.keycloak.client-secret=TU_SECRET

spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code

spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8085/realms/DonaTrack