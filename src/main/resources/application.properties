spring.application.name=clienteliviano
server.port=8086

# compose.yaml no declara ningun servicio: el cliente liviano no necesita
# contenedores propios, consume las APIs del backend por HTTP. Con el soporte
# activo, la app no arranca en maquinas sin Docker instalado.
spring.docker.compose.enabled=false
backend.api.url.donaciones:http://localhost:8080/donaciones-service

# --- Keycloak ---
# Base y realm. Cambiar aca, no en el codigo.
keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8085}
keycloak.realm=${KEYCLOAK_REALM:DonaTrack}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:donatrack-client}

# Cuenta de administracion del realm, que usa el alta de usuarios (Admin API).
# El valor por defecto es el del contenedor de desarrollo de Keycloak, para que
# el proyecto arranque sin configurar nada. En cualquier otro entorno se
# sobreescribe por variable de entorno y NUNCA se commitea el valor real:
#   export KEYCLOAK_ADMIN_USER=...  KEYCLOAK_ADMIN_PASSWORD=...
keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM:master}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
keycloak.admin.username=${KEYCLOAK_ADMIN_USER:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}

spring.security.oauth2.client.registration.keycloak.client-id=donatrack-client

# Si le pusiste un Client Secret en Keycloak al cliente, agregalo acá:
# spring.security.oauth2.client.registration.keycloak.client-secret=TU_SECRET

spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code

spring.security.oauth2.client.provider.keycloak.issuer-uri=${keycloak.base-url}/realms/${keycloak.realm}