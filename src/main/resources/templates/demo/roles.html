<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- ANDAMIO DE DESARROLLO — se borra junto con DemoController. -->
<head th:replace="~{fragments/layout :: head('Probar como', 'Elegí un rol para recorrer las vistas.')}"></head>
<body>
<a th:replace="~{fragments/layout :: skip-link}"></a>
<header th:replace="~{fragments/navbar :: publica('')}"></header>

<main id="main" class="container" style="padding: var(--space-7) var(--space-5);">
    <div class="card" style="max-width: 560px; margin: 0 auto;">
        <h1 style="font-size: var(--text-lg);">Recorrer como…</h1>
        <div class="banner banner-info" role="note" style="margin: var(--space-4) 0;">
            <span aria-hidden="true">🛠</span>
            <p>
                <strong>Modo de desarrollo</strong>
                Esto no es autenticación: abre una sesión de prueba con datos precargados
                para revisar las plantillas sin Keycloak. Se elimina al conectar el login real.
            </p>
        </div>
        <div class="flex flex-col gap-3">
            <a th:each="rol : ${roles}"
               th:href="@{/demo/{r}(r=${rol.name().toLowerCase()})}"
               th:text="${rol.etiqueta}"
               class="btn btn-secondary btn-block">Donante</a>
        </div>
        <p style="margin-top: var(--space-5);">
            <a th:href="@{/}">Volver al inicio</a>
        </p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
